<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>明日方舟終末地小工具</title>
    <link rel="icon" href="media/ICON.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-inner">
                <div class="logo">
                    <img class="logo-icon" src="media/ICON.png" alt="Logo">
                    <div class="logo-text">終末地 <span>小工具</span></div>
                </div>
                <nav>
                    <button class="active" data-tab="operators">角色</button>
                    <button data-tab="weapons">武器</button>
                    <button data-tab="gears">基質</button>
                </nav>
                <button class="add-character-btn" id="add-character-btn" title="新增角色" style="display:none;">
                    <span>+ 新增角色</span>
                </button>
                <button class="admin-btn" id="admin-login-btn" title="管理員登入">
                    <span>🔒 管理員</span>
                </button>
                <button class="theme-toggle" id="theme-toggle" title="切換明暗主題">
                    <span class="theme-icon">☀️</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="operators" class="tab-content active">
            <div class="section-header">
                <h2>角色列表</h2>
                <p>點擊角色查看詳細資訊與推薦隊友</p>
            </div>
            <div class="search-box">
                <input type="text" id="operator-search" placeholder="搜尋角色名稱..." autocomplete="off">
                <select id="operator-sort">
                    <option value="rarity-desc" selected>星數 高→低</option>
                    <option value="rarity-asc">星數 低→高</option>
                    <option value="name-asc">名稱 A→Z</option>
                    <option value="name-desc">名稱 Z→A</option>
                    <option value="class">職業</option>
                    <option value="element">屬性</option>
                </select>
            </div>
            <div class="filter-buttons" id="operator-filters">
                <div class="filter-row">
                    <span class="filter-label">星數：</span>
                    <button class="filter-btn active" data-orarity="all">全部</button>
                    <button class="filter-btn" data-orarity="6">六星</button>
                    <button class="filter-btn" data-orarity="5">五星</button>
                    <button class="filter-btn" data-orarity="4">四星</button>
                </div>
                <div class="filter-row">
                    <span class="filter-label">屬性：</span>
                     <button class="filter-btn active" data-element="all">全部</button>
                     <button class="filter-btn" data-element="Nature">自然</button>
                     <button class="filter-btn" data-element="Heat">灼熱</button>
                     <button class="filter-btn" data-element="Physical">物理</button>
                     <button class="filter-btn" data-element="Cryo">寒冷</button>
                     <button class="filter-btn" data-element="Electric">電擊</button>
                </div>
                <div class="filter-row">
                    <span class="filter-label">職業：</span>
                    <button class="filter-btn active" data-class="all">全部</button>
                    <button class="filter-btn" data-class="Striker">突擊</button>
                    <button class="filter-btn" data-class="Guard">近衛</button>
                    <button class="filter-btn" data-class="Caster">術師</button>
                    <button class="filter-btn" data-class="Vanguard">先鋒</button>
                    <button class="filter-btn" data-class="Defender">重裝</button>
                    <button class="filter-btn" data-class="Support">輔助</button>
                </div>
            </div>
            <div id="operators-grid" class="grid grid-operators"></div>
        </div>

        <div id="weapons" class="tab-content">
            <div class="section-header">
                <h2>武器圖鑑</h2>
                <p>瀏覽所有武器屬性与適用基質</p>
            </div>
            <div class="search-box">
                <input type="text" id="weapon-search" placeholder="搜尋武器名稱..." autocomplete="off">
                <select id="sort-select">
                    <option value="rarity-desc" selected>星數 高→低</option>
                    <option value="rarity-asc">星數 低→高</option>
                    <option value="name-asc">名稱 A→Z</option>
                </select>
            </div>
            <div class="filter-buttons">
                <div class="filter-row">
                    <span class="filter-label">稀有度：</span>
                    <button class="filter-btn active" data-rarity="all">全部</button>
                    <button class="filter-btn" data-rarity="6">六星</button>
                    <button class="filter-btn" data-rarity="5">五星</button>
                    <button class="filter-btn" data-rarity="4">四星</button>
                    <button class="filter-btn" data-rarity="3">三星</button>
                </div>
                <div class="filter-row">
                    <span class="filter-label">種類：</span>
                    <button class="filter-btn type-btn active" data-type="all">全部</button>
                    <button class="filter-btn type-btn" data-type="Sword">單手劍</button>
                    <button class="filter-btn type-btn" data-type="Greatsword">雙手劍</button>
                    <button class="filter-btn type-btn" data-type="Polearm">長柄武器</button>
                    <button class="filter-btn type-btn" data-type="Arts Unit">施術單元</button>
                    <button class="filter-btn type-btn" data-type="Handcannon">手銃</button>
                </div>
            </div>
            <div id="weapons-grid" class="grid grid-weapons"></div>
        </div>

        <div id="gears" class="tab-content">
            <div class="section-header">
                <h2>基質列表</h2>
                <p>選擇掉落區域的,自選詞條</p>
            </div>
            <div class="zone-buttons">
                <button class="zone-btn" data-zone="all">全部區域</button>
                <button class="zone-btn" data-zone="樞紐區">樞紐區</button>
                <button class="zone-btn" data-zone="源石研究園">源石研究園</button>
                <button class="zone-btn" data-zone="礦脈源區">礦脈源區</button>
                <button class="zone-btn" data-zone="供能高地">供能高地</button>
                <button class="zone-btn" data-zone="武陵城">武陵城</button>
            </div>
            <div id="gear-filters" class="filter-buttons" style="display:none;">
                <div class="filter-row gear-mainstat-row">
                    <span class="filter-label">基礎屬性：</span>
                </div>
                <div class="filter-row gear-substat-row">
                    <span class="filter-label">附加屬性：</span>
                </div>
                <div class="filter-row gear-skill-row">
                    <span class="filter-label">技能屬性：</span>
                </div>
            </div>
            <div id="gear-results" style="display:none;">
                <div class="section-header" style="margin-top: 24px;">
                    <h2><span id="gear-zone-name"></span> - 適用的武器 (<span id="gear-weapon-count">0</span>)</h2>
                </div>
                <div id="gear-weapons-grid" class="grid grid-weapons"></div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">角色詳情</h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>

    <div class="modal-overlay" id="admin-login-modal">
        <div class="modal modal-admin-login">
            <div class="modal-header">
                <h3>管理員登入</h3>
                <button class="modal-close" id="admin-login-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="admin-password">密碼</label>
                    <input type="password" id="admin-password" placeholder="輸入管理員密碼">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="admin-cancel">取消</button>
                    <button type="button" class="btn btn-primary" id="admin-submit">登入</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="select-modal">
        <div class="modal modal-select">
            <div class="modal-header">
                <h3 id="select-modal-title">選擇</h3>
                <button class="modal-close" id="select-modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="select-grid" id="select-grid"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="select-cancel">取消</button>
                <button type="button" class="btn btn-primary" id="select-confirm">確定</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="add-character-modal">
        <div class="modal modal-add-character">
            <div class="modal-header">
                <h3 id="add-character-title">新增角色</h3>
                <button class="modal-close" id="add-character-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="add-character-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="char-name">角色名字 *</label>
                            <input type="text" id="char-name" name="name" required placeholder="輸入角色名稱">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="char-icon">角色icon</label>
                            <div class="image-picker-row">
                                <input type="text" id="char-icon" name="icon" placeholder="輸入檔案名稱">
                                <button type="button" class="btn btn-secondary" id="pick-icon-btn">選擇圖片</button>
                            </div>
                            <div class="image-preview" id="icon-preview">
                                <span class="image-preview-placeholder">無圖片</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="char-fullimage">角色全身圖片</label>
                            <div class="image-picker-row">
                                <input type="text" id="char-fullimage" name="fullImage" placeholder="輸入檔案名稱">
                                <button type="button" class="btn btn-secondary" id="pick-fullimage-btn">選擇圖片</button>
                            </div>
                            <div class="image-preview" id="fullimage-preview">
                                <span class="image-preview-placeholder">無圖片</span>
                            </div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="char-rarity">星數 *</label>
                            <select id="char-rarity" name="rarity" required>
                                <option value="">選擇星數</option>
                                <option value="6">六星</option>
                                <option value="5">五星</option>
                                <option value="4">四星</option>
                                <option value="3">三星</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="char-class">職業 *</label>
                            <select id="char-class" name="class" required>
                                <option value="">選擇職業</option>
                                <option value="Striker">突擊</option>
                                <option value="Guard">近衛</option>
                                <option value="Caster">術師</option>
                                <option value="Vanguard">先鋒</option>
                                <option value="Defender">重裝</option>
                                <option value="Support">輔助</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="char-element">屬性 *</label>
                            <select id="char-element" name="element" required>
                                <option value="">選擇屬性</option>
                                <option value="Nature">自然</option>
                                <option value="Heat">灼熱</option>
                                <option value="Physical">物理</option>
                                <option value="Cryo">寒冷</option>
                                <option value="Electric">電擊</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="char-weapon">武器 *</label>
                            <select id="char-weapon" name="weapon" required>
                                <option value="">選擇武器類型</option>
                                <option value="Sword">單手劍</option>
                                <option value="Greatsword">雙手劍</option>
                                <option value="Polearm">長柄武器</option>
                                <option value="Arts Unit">施策單元</option>
                                <option value="Handcannon">手銃</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="char-mainstat">主屬性</label>
                            <select id="char-mainstat" name="mainStat">
                                <option value="">選擇主屬性</option>
                                <option value="力量">力量</option>
                                <option value="敏捷">敏捷</option>
                                <option value="智識">智識</option>
                                <option value="意志">意志</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="char-substat">副屬性</label>
                            <select id="char-substat" name="subStat">
                                <option value="">選擇副屬性</option>
                                <option value="力量">力量</option>
                                <option value="敏捷">敏捷</option>
                                <option value="智識">智識</option>
                                <option value="意志">意志</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="char-trait">角色特性</label>
                            <textarea id="char-trait" name="trait" rows="2" placeholder="輸入角色特性描述"></textarea>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="char-description">角色背景</label>
                            <textarea id="char-description" name="description" rows="3" placeholder="輸入角色背景描述"></textarea>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>推薦隊友 (最多選3個) <span id="teammates-count">0/3</span></label>
                            <button type="button" class="btn btn-secondary" id="select-teammates-btn">選擇推薦隊友</button>
                            <div class="selected-tags" id="teammates-tags"></div>
                            <input type="hidden" id="char-teammates" name="teammates">
                        </div>
                        <div class="form-group">
                            <label>推薦裝備 (最多選4個) <span id="gear-count">0/4</span></label>
                            <button type="button" class="btn btn-secondary" id="select-gear-btn">選擇推薦裝備</button>
                            <div class="selected-tags" id="gear-tags"></div>
                            <input type="hidden" id="char-gear" name="gear">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>推薦武器 (最多選3個) <span id="weapons-count">0/3</span></label>
                            <button type="button" class="btn btn-secondary" id="select-weapons-btn">選擇推薦武器</button>
                            <div class="selected-tags" id="weapons-tags"></div>
                            <input type="hidden" id="char-weapons" name="weapons">
                            <input type="hidden" id="char-exclusive-weapon" name="exclusiveWeapon">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="cancel-add-character">取消</button>
                        <button type="submit" class="btn btn-primary">儲存角色</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>明日方舟：終末地 小工具 - 僅供學習交流使用 powered by YUKINOKO</p>
        </div>
    </footer>

    <button class="back-to-top" id="back-to-top" title="返回頂部">↑</button>
    <div class="toast-container" id="toast-container"></div>

    <script src="config.js"></script>
    <script src="operators_local.js"></script>
    <script src="weapons.js"></script>
    <script src="gears.js"></script>
    <script src="utils.js"></script>
    <script src="performance.js"></script>
    <script src="search-index.js"></script>
    <script src="ui-components.js"></script>
    <script src="gear_tc.js"></script>
    <script src="app.js"></script>
    <script src="tests.js"></script>
</body>
</html>
